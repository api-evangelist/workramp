    name: WorkRamp API
    description: >-
      REST API for the Confirm Learn:Up and Academy platform (formerly WorkRamp): manage
      users, groups and custom attributes, guides/courses, paths, challenges, SCORM courses
      and assignments, resources, events and sessions, item folders, libraries and the
      content catalog, plus Academy contacts, segments, trainings, certifications and
      registrations, webhook subscriptions and SCIM 2.0 provisioning. 137 operations across
      two published definitions, secured with an admin-scoped API key sent as a bearer token.
