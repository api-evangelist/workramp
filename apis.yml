aid: workramp
name: WorkRamp
description: >-
  WorkRamp is a revenue-enablement and learning platform now sold by Confirm as two products
  — Learn:Up (the employee LMS, formerly WorkRamp) and Academy (customer and partner
  training) — after Learning Pool rebranded as Confirm and consolidated WorkRamp, Confirm HR,
  AI Sims and Elucidat under one Workforce Enablement System. The API is still served from
  app.workramp.com and documented at developers.workramp.com as the "Confirm Learn:Up &
  Academy API". It is a private REST API — access is granted per enterprise on request — and
  covers users, groups, custom attributes, guides/courses, paths (training series),
  challenges, SCORM courses and assignments, resources, events and event sessions, item
  folders and libraries, the content catalog, Academy contacts, segments, trainings,
  certifications, registrations and email domains, plus webhook subscriptions and SCIM 2.0
  provisioning. Authentication is a static admin-scoped API key sent as a bearer token;
  published rate limits are 3,000 calls/hour sustained with a 13,000 calls/hour burst, and EU
  tenants call app.eu.workramp.com.
