note: >-
  WorkRamp publishes no AsyncAPI, CloudEvents or event-schema document. It does publish a
  real, documented webhook surface with a named event catalog, per-event payload field
  tables and self-service subscription management endpoints, so this artifact captures the
  webhook catalog verbatim from the docs and from the two harvested OpenAPI documents. No
  event was invented.
docs:
  intro: https://developers.workramp.com/reference/elc-webhooks-intro
  user_object: https://developers.workramp.com/reference/user-object-1
transport:
  protocol: https
  delivery: >-
    WorkRamp POSTs the event payload to a subscriber-provided endpoint when the event
    occurs. Subscription URLs must be HTTPS.
  content_type: application/json
  signature: none documented
  secret: none documented
  retries: not documented
  ordering: not documented
  replay: not documented
subscription_management:
  employee_learning_cloud:
    list: GET /api/v1/webhook_subscriptions
    get: GET /api/v1/webhook_subscriptions/{webhook_subscription_id}
    create: POST /api/v1/webhook_subscriptions
    update: PATCH /api/v1/webhook_subscriptions/{webhook_subscription_id}
    delete: DELETE /api/v1/webhook_subscriptions/{webhook_subscription_id}
    create_body: {name: string, url: 'https endpoint', eventTypes: [string]}
    source: openapi/workramp-json-api-openapi.yml
  academy:
    list: GET /api/v1/academies/{academy_id}/webhook_subscriptions
    get: GET /api/v1/academies/{academy_id}/webhook_subscriptions/{subscription_id}
    create: POST /api/v1/academies/{academy_id}/webhook_subscriptions
    update: PATCH /api/v1/academies/{academy_id}/webhook_subscriptions/{subscription_id}
    delete: DELETE /api/v1/academies/{academy_id}/webhook_subscriptions/{subscription_id}
    create_body: {webhookName: string, url: 'https endpoint', eventTypes: [string]}
    source: openapi/workramp-json-api-openapi.yml
common_payload:
  fields:
    - {name: eventType, type: string, description: type of the event}
    - {name: timestamp, type: integer, description: UNIX epoch milliseconds when the event occurred}
