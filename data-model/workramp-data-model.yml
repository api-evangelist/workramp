generated: '2026-08-13'
method: derived
source: openapi/workramp-api-settings-openapi.yml, openapi/workramp-json-api-openapi.yml
docs: https://developers.workramp.com/reference/user-object
note: >-
  Derived from path structure, path parameters and id-bearing fields in the two harvested
  OpenAPI documents, plus the published object reference pages. Neither definition uses
  components.schemas — every body is an inline schema — so there is no reusable model in the
  contract and this graph is reconstructed from naming, not from $ref links.
tenancy:
  root: Enterprise
  note: >-
    Everything hangs off an enterprise (the API key's tenant, surfaced as enterpriseId).
    Within it the model forks into two product halves that do not share a URL namespace.
domains:
  - name: Employee Learning Cloud (Learn:Up)
    prefix: /api/v1/<resource>
    entities: [User, Group, Guide, Path, Challenge, SCORM, Resource, Event, EventSession, ItemFolder, Library, WebhookSubscription]
  - name: Academy (customer/partner learning)
    prefix: /api/v1/academies/{academy_id}/<resource>
    entities: [Academy, Contact, Segment, Training, Path, Certification, Registration, Collection, Event, EventSession, AcademyObjectAttribute, EmailDomain, WebhookSubscription]
    note: 50 of 117 distinct paths are nested under {academy_id}, making Academy the single heaviest parent in the model.
  - name: Provisioning
    prefix: /scim/v2/<resource>
    entities: [ScimUser, ScimGroup]
entities:
  - name: User
    domain: employee
    id: user_id (also UserID, userId)
    collection: /api/v1/users
    docs: https://developers.workramp.com/reference/user-object
    fields_observed: [id, name, email, isAdmin, isDeleted, isPermanentlyDeleted, createdAt, updatedAt, groups, customAttributes, userIdentifiers, managers, externalId]
  - name: Group
    domain: employee
    id: GroupID / group_id
    collection: /api/v1/groups
  - name: CustomUserAttribute
    domain: employee
    id: apiName
    collection: /api/v1/attributes/user/{UserID}
  - name: Guide
    domain: employee
    aka: Course
    id: GuideID / guideId / courseId
    collection: /api/v1/guides
  - name: GuideAssignment
    domain: employee
    id: GuideAssignmentID / courseUserAssignmentId
    collection: /api/v1/guides/{GuideID}/assignments
  - name: Path
    domain: employee
    aka: Training Series
    id: path_id / trainingSeriesId
    collection: /api/v1/paths
  - name: PathAssignment
    domain: employee
    id: assignment_id / trainingSeriesUserAssignmentId
    collection: /api/v1/paths/{path_id}/assignments
  - name: Challenge
    domain: employee
    id: challenge_id / challengeId
    collection: /api/v1/challenge/{challenge_id}
  - name: ChallengeAssignment
    domain: employee
    id: challengeUserAssignmentId
  - name: Scorm
    domain: employee
    id: scorm_id
    collection: /api/v1/scorms
  - name: ScormAssignment
    domain: employee
    id: assignment_id
    collection: /api/v1/scorm_assignments/{assignment_id}
  - name: Resource
    domain: employee
    collection: /api/v1//resources
    note: 'Path is served with a double slash in the contract as published.'
  - name: Event
    domain: shared
    id: event_id / EventID / trainingClassId
    collection: /api/v1/events
  - name: EventSession
    domain: shared
    id: session_id / event_session_id
    collection: /api/v1/events/{EventID}/session
    fields_observed: [start_time, end_time, zoomMeetingId]
  - name: EventSessionAttendee
    domain: shared
    id: trainingClassSessionAttendeeId
    collection: /api/v1/academies/{academy_id}/event_sessions/{event_session_id}/attendees
  - name: ItemFolder
    domain: employee
    id: item_folder_id
    collection: /api/v1/item_folders
    fields_observed: [parent_item_folder_id]
  - name: Library
    domain: employee
    aka: University
    id: library_id
    collection: /api/v1/universities
  - name: ContentCatalog
    domain: employee
    collection: /api/v1/content_catalog
  - name: Academy
    domain: academy
    id: academy_id
    docs: https://developers.workramp.com/reference/academy-id
  - name: Contact
    domain: academy
    id: contact_id
    collection: /api/v1/academies/{academy_id}/users
    note: Academy Contacts are a separate identity space from Employee Users.
  - name: Segment
    domain: academy
    id: segment_id
    note: Dynamic group of Academy contacts.
  - name: Training
    domain: academy
    id: training_id
    collection: /api/v1/academies/{academy_id}/trainings
  - name: Certification
    domain: academy
    id: certification_id / cert_id
    collection: /api/v1/academies/{academy_id}/certifications
  - name: AwardedCertification
    domain: academy
    collection: /api/v1/academies/{academy_id}/awarded_certifications
  - name: Registration
    domain: academy
    id: registration_id
    collection: /api/v1/academies/{academy_id}/registrations
  - name: Collection
    domain: academy
    id: collection_id
    collection: /api/v1/academies/{academy_id}/collections
  - name: AcademyObjectAttribute
    domain: academy
    collection: /api/v1/academies/{academy_id}/academy_object_attributes
  - name: EmailDomain
    domain: academy
    collection: /api/v1/academies/{academy_id}/email_domains
  - name: WebhookSubscription
    domain: both
    id: webhook_subscription_id / subscription_id
    collection: /api/v1/webhook_subscriptions and /api/v1/academies/{academy_id}/webhook_subscriptions
  - name: ResellerCustomer
    domain: white-label
    collection: /api/v1/reseller_customers
    docs: https://developers.workramp.com/reference/white-label-customers
  - name: ScimUser
    domain: provisioning
    collection: /scim/v2/Users
  - name: ScimGroup
    domain: provisioning
    collection: /scim/v2/Groups
