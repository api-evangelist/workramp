identifiers:
  style: mixed
  note: >-
    The API mixes integer ids (Users, Groups — e.g. user id 1) with UUID/ULID-style strings
    (assignments, guides, paths, challenges — e.g. 0191fc31-c100-75ce-a928-26ceada9e14f). It
    also mixes casing conventions in path parameters ({user_id} and {UserID}, {GuideID} and
    {guideId}), which is a real interoperability hazard for generated clients.
  prefixes: none
render: null
gaps:
  - No components.schemas in either definition; nothing is reusable or $ref-able.
  - Employee Users and Academy Contacts are distinct identity spaces with no documented join key.
  - Same concept, three names — Guide/Course, Path/Training Series, Library/University.
