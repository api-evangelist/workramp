                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 8
                      default: 0
                    enterpriseId:
                      type: integer
                      example: 23
                      default: 0
                    name:
                      type: string
                      example: SDR New Hires - August
                    createdAt:
                      type: number
