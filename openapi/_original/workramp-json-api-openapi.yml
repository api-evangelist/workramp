openapi: 3.1.0
info:
  title: json-api
  version: '1.0'
servers:
- url: https://app.workramp.com
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: ACCESS_TOKEN
security:
- sec0: []
paths:
  /api/v1/users:
    post:
      summary: Create User
      description: Create a user within the enterprise
      operationId: create-user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                name:
                  type: string
                managers:
                  type: array
                  description: Array of user ids to associate as a manager
                  items:
                    type: integer
                    format: int32
                groups:
                  type: array
                  items:
                    type: integer
                    format: int32
                isAdmin:
                  type: boolean
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 5065,\n  \"name\": \"Jane Doe\",\n  \"email\": \"ted+apitester1234@workramp.com\"\
                    ,\n  \"isAdmin\": false,\n  \"isDeleted\": false,\n  \"createdAt\": 1488144236206.5808,\n\
                    \  \"updatedAt\": 1488144236206.5808,\n  \"mentors\": [\n    {\n      \"id\": 69,\n\
                    \      \"name\": \"Ted Blosser\",\n      \"email\": \"ted@workramp.com\",\n      \"\
                    isAdmin\": true,\n      \"createdAt\": 1429851794143.246,\n      \"updatedAt\": 1487379136689.895\n\
                    \    }\n  ],\n  \"groups\": [\n    {\n      \"id\": 185,\n      \"enterpriseId\":\
                    \ 23,\n      \"name\": \"NA Interns\",\n      \"createdAt\": 1463354276004.189,\n\
                    \      \"updatedAt\": 1463354276004.189\n    },\n    {\n      \"id\": 186,\n     \
                    \ \"enterpriseId\": 23,\n      \"name\": \"Risk Interns\",\n      \"createdAt\": 1463354276027.895,\n\
                    \      \"updatedAt\": 1463354276027.895\n    }\n  ]\n}\n"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 5065
                    default: 0
                  name:
                    type: string
                    example: Jane Doe
                  email:
                    type: string
                    example: ted+apitester1234@workramp.com
                  isAdmin:
                    type: boolean
                    example: false
                    default: true
                  isDeleted:
                    type: boolean
                    example: false
                    default: true
                  createdAt:
                    type: number
                    example: 1488144236206.5808
                    default: 0
                  updatedAt:
                    type: number
                    example: 1488144236206.5808
                    default: 0
                  mentors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 69
                          default: 0
                        name:
                          type: string
                          example: Ted Blosser
                        email:
                          type: string
                          example: ted@workramp.com
                        isAdmin:
                          type: boolean
                          example: true
                          default: true
                        createdAt:
                          type: number
                          example: 1429851794143.246
                          default: 0
                        updatedAt:
                          type: number
                          example: 1487379136689.895
                          default: 0
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 185
                          default: 0
                        enterpriseId:
                          type: integer
                          example: 23
                          default: 0
                        name:
                          type: string
                          example: NA Interns
                        createdAt:
                          type: number
                          example: 1463354276004.189
                          default: 0
                        updatedAt:
                          type: number
                          example: 1463354276004.189
                          default: 0
      deprecated: false
  /api/v1/users/{user_id}:
    post:
      summary: Update User
      description: Updates a user's attributes
      operationId: update-user-1
      parameters:
      - name: user_id
        in: path
        description: ID of user to update
        schema:
          type: integer
          format: int32
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: '[Optional]'
                name:
                  type: string
                  description: '[Optional]'
                isAdmin:
                  type: boolean
                  description: '[Optional]'
                isDeleted:
                  type: boolean
                  description: '[Optional]'
                managerEmails:
                  type: array
                  description: '[Optional] Array of existing manager emails.'
                  items:
                    type: string
                overwriteManagerEmails:
                  type: boolean
                  description: '[Optional] If set to true, user''s managers will be exactly what `managerEmails`
                    is set to. Having an empty array for `mangerEmails` while this is true will delete
                    all managers of the user.'
                custom_attributes:
                  type: object
                  description: '[Optional] An object that represents all custom attributes the user should
                    have. This will OVERWRITE the existing custom attributes and be set exactly as the
                    object that is passed in.'
                  properties:
                    key:
                      type: string
                      description: API key for this custom attribute
                    value:
                      type: string
                      description: Value to set this custom attribute to
                update_custom_attributes:
                  type: object
                  description: '[Optional] Create/update custom attributes for this user without deleting
                    the existing values first. Use this INSTEAD OF custom_attributes!'
                  properties:
                    key:
                      type: string
                      description: API key for this custom attribute
                    value:
                      type: string
                      description: Value to set this custom attribute to
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 5065,\n  \"name\": \"Jane Doe\",\n  \"email\": \"ted+apitester1234@workramp.com\"\
                    ,\n  \"isAdmin\": false,\n  \"isDeleted\": false,\n  \"isPermanentlyDeleted\": false,\n\
                    \  \"createdAt\": 1488144236206.5808,\n  \"updatedAt\": 1488144236206.5808,\n  \"\
                    mentors\": [\n    {\n      \"id\": 7,\n      \"name\": \"John Doe\",\n      \"email\"\
                    : \"jdoe@workramp.com\",\n      \"isAdmin\": false,\n      \"isDeleted\": false,\n\
                    \      \"isPermanentlyDeleted\": false,\n      \"createdAt\": 1564692110394,\n   \
                    \   \"updatedAt\": 1589355546681\n    },\n    {\n      \"id\": 4,\n      \"name\"\
                    : \"John Smith\",\n      \"email\": \"jsmith@workramp.com\",\n      \"isAdmin\": false,\n\
                    \      \"isDeleted\": false,\n      \"isPermanentlyDeleted\": false,\n      \"createdAt\"\
                    : 1564692048130,\n      \"updatedAt\": 1589359593434\n    }\n  ],\n  \"mentorsViaGroups\"\
                    : []\n}\n"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 5065
                    default: 0
                  name:
                    type: string
                    example: Jane Doe
                  email:
                    type: string
                    example: ted+apitester1234@workramp.com
                  isAdmin:
                    type: boolean
                    example: false
                    default: true
                  isDeleted:
                    type: boolean
                    example: false
                    default: true
                  isPermanentlyDeleted:
                    type: boolean
                    example: false
                    default: true
                  createdAt:
                    type: number
                    example: 1488144236206.5808
                    default: 0
                  updatedAt:
                    type: number
                    example: 1488144236206.5808
                    default: 0
                  mentors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 7
                          default: 0
                        name:
                          type: string
                          example: John Doe
                        email:
                          type: string
                          example: jdoe@workramp.com
                        isAdmin:
                          type: boolean
                          example: false
                          default: true
                        isDeleted:
                          type: boolean
                          example: false
                          default: true
                        isPermanentlyDeleted:
                          type: boolean
                          example: false
                          default: true
                        createdAt:
                          type: integer
                          example: 1564692110394
                          default: 0
                        updatedAt:
                          type: integer
                          example: 1589355546681
                          default: 0
                  mentorsViaGroups:
                    type: array
      deprecated: false
  /api/v1/groups:
    post:
      summary: Create Group
      description: Create a group in the enterprise
      operationId: create-group
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 123,\n  \"enterpriseId\": 123,\n  \"name\": \"Marketing\",\n  \"\
                    originalName\": \"Marketing\",\n  \"hasManagers\": false,\n  \"fromSso\": false,\n\
                    \  \"groupAutomationsCount\": 0,\n  \"activeGroupAutomationsCount\": 0,\n  \"description\"\
                    : \"Optional Group description\",\n  \"createdAt\": 1592977736126,\n  \"updatedAt\"\
                    : 1592977736126\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 123
                    default: 0
                  enterpriseId:
                    type: integer
                    example: 123
                    default: 0
                  name:
                    type: string
                    example: Marketing
                  originalName:
                    type: string
                    example: Marketing
                  hasManagers:
                    type: boolean
                    example: false
                    default: true
                  fromSso:
                    type: boolean
                    example: false
                    default: true
                  groupAutomationsCount:
                    type: integer
                    example: 0
                    default: 0
                  activeGroupAutomationsCount:
                    type: integer
                    example: 0
                    default: 0
                  description:
                    type: string
                    example: Optional Group description
                  createdAt:
                    type: integer
                    example: 1592977736126
                    default: 0
                  updatedAt:
                    type: integer
                    example: 1592977736126
                    default: 0
      deprecated: false
  /api/v1/groups/{GroupID}:
    post:
      summary: Update Group
      description: Update a group within the enterprise
      operationId: update-group
      parameters:
      - name: GroupID
        in: path
        description: ID of group to be modified
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": 283,\n  \"name\": \"Marketing US\",\n  \"createdAt\": 1866832522351.831,\n\
                    \  \"updatedAt\": 1866832522351.834,\n  \"id\": 123,\n  \"enterpriseId\": 123,\n \
                    \ \"name\": \"Marketing US\",\n  \"originalName\": \"Marketing US\",\n  \"hasManagers\"\
                    : false,\n  \"fromSso\": false,\n  \"groupAutomationsCount\": 0,\n  \"activeGroupAutomationsCount\"\
                    : 0,\n  \"description\": \"Marketing US Description\",\n  \"createdAt\": 1592978265537,\n\
                    \  \"updatedAt\": 1592978395038\n}"
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 123
                    default: 0
                  name:
                    type: string
                    example: Marketing US
                  createdAt:
                    type: integer
                    example: 1592978265537
                    default: 0
                  updatedAt:
                    type: integer
                    example: 1592978395038
                    default: 0
                  enterpriseId:
                    type: integer
                    example: 123
                    default: 0
                  originalName:
                    type: string
                    example: Marketing US
                  hasManagers:
                    type: boolean
                    example: false
                    default: true
                  fromSso:
                    type: boolean
                    example: false
                    default: true
                  groupAutomationsCount:
                    type: integer
                    example: 0
                    default: 0
                  activeGroupAutomationsCount:
                    type: integer
                    example: 0
                    default: 0
                  description:
                    type: string
                    example: Marketing US Description
      deprecated: false
  /api/v1/groups/{GroupID}/users:
    post:
      summary: Assign a User to a Group
      description: Get all groups within the enterprise
      operationId: assign-a-user-to-a-group-1
      parameters:
      - name: GroupID
        in: path
        description: The group id to add user to
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - userId
              properties:
                userId:
                  type: integer
                  description: id of the user you want to assign to a group
                  format: int32
                startDate:
                  type: string
                  description: Unix time in milliseconds representing the start date of the user. This
                    date is used to calculate the due date when assigning guides/series through group
                    automations
                  default: Optional
                  format: date-time
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: 'true

                    '
              schema:
                type: boolean
                example: true
                default: true
      deprecated: false
  /api/v1/instant_auth:
    post:
      summary: Instant Auth
      description: Create instant login URLs for your employees
      operationId: elc-instant-auth
      parameters:
      - name: Content-Type
        in: header
        description: application/json
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  description: Email address of the user
                redirect_to:
                  type: string
                  description: A relative WorkRamp URL to redirect the user to after login
                name:
                  type: string
                  description: Full name of the user
                isAdmin:
                  type: boolean
                  description: Is the user an admin?
                  default: false
                isManager:
                  type: boolean
                  description: Is the user a manager?
                  default: false
                customAttributes:
                  type: object
                  description: A mapping of api_name->value for custom attributes to set for the user
                  properties:
                    key:
                      type: string
                      description: API key for this custom attribute
                    value:
                      type: string
                      description: Value to set this custom attribute to
                groups:
                  type: array
                  description: IDs of groups that the user should be added to
                  items:
                    type: integer
                    format: int32
                managers:
                  type: array
                  description: IDs of managers that the user should be managed by
                  items:
                    type: integer
                    format: int32
                managerEmails:
                  type: array
                  description: Email addresses of managers that the user should be managed by (managers
                    takes precedence)
                  items:
                    type: string
                managerNames:
                  type: array
                  description: Names of managers that the user should be managed by (managers and manager_emails
                    take precedence)
                  items:
                    type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"url\": \"https://random-example.app.workramp.com/instant-login/1234567890abcdef\"\
                    \n}"
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: https://random-example.app.workramp.com/instant-login/1234567890abcdef
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /api/v1/attributes/user/{UserID}:
    post:
      summary: Set Custom Attributes for a User
      description: Adds or updates custom attributes for a user
      operationId: add-custom-user-attributes
      parameters:
      - name: UserID
        in: path
        description: ID to set attributes for
        schema:
          type: integer
          format: int32
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes:
                  type: string
                  description: Key `attributes` is required and is a dictionary of your attribute 'api
                    names' → value
                  default: '{}'
                  format: json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: 'true'
              schema:
                type: boolean
                example: true
                default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Bad Date Format:
                  value: '{"type":"bad_request","message":"Date format not accepted, please try a different
                    format."}'
                User not found:
                  value: '"user with id 12345 not found"'
                Nonexistent Attribute:
                  value: '{ "errors": "''example'' is not a custom attribute on ''user'' of id ''12345''"'
              schema:
                oneOf:
                - title: Bad Date Format
                  type: object
                  properties:
                    type:
                      type: string
                      example: bad_request
                    message:
                      type: string
                      example: Date format not accepted, please try a different format.
                - title: User not found
                  type: string
                  example: user with id 12345 not found
      deprecated: false
    delete:
      summary: Delete a Custom Attribute from a User
      description: Deletes one or more custom attribute values from a single user
      operationId: delete-custom-user-attributes
      parameters:
      - name: UserID
        in: path
        description: The user id to clear the attributes for
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                attributes:
                  type: array
                  description: An array of custom attributes (their API names) to delete.
                  items:
                    type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: 'true'
              schema:
                type: boolean
                example: true
                default: true
      deprecated: false
  /api/v1/assignments/guide:
    get:
      summary: Get All Guide Assignments in Date Range
      description: ''
      operationId: get-guide-assignments-in-date-range
      parameters:
      - name: start_time
        in: query
        description: The minimum created/updated timestamp. This should be an ISO 8601 date/time.
        schema:
          type: string
      - name: end_time
        in: query
        description: The maximum created/updated timestamp. This should be an ISO8601 date/time.
        schema:
          type: string
      - name: due_date
        in: query
        description: ISO8601 date or datetime to filter on assignment due date
        schema:
          type: string
      - name: guide_id
        in: query
        description: A specific guide to limit the results to. - If `guide_id` is not provided it will
          return _all_ Guide assignments created or updated within the date range.
        schema:
          type: string
      - name: include_deleted
        in: query
        description: Optional - if you want to also retrieve assignments which have been deleted, pass
          true. Use the is_deleted field in the response to detect these.
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        description: Page of results to return
        schema:
          type: integer
          format: int32
          default: 1
      - name: per_page
        in: query
        description: Number of results to return per page (1-200)
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: '200'
          content:
