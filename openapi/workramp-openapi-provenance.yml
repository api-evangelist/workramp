note: >-
  WorkRamp does not publish a downloadable OpenAPI file. Its developer portal is
  ReadMe, and every /reference/<operation> page server-renders a complete OpenAPI
  3.1.0 document for its parent API definition inside the page's ssr-props payload.
  These two files are those documents, taken verbatim from the provider-served HTML
  across 100 reference pages and de-duplicated (the most complete rendering of each
  definition was used as the base; no operation was authored, edited or inferred).
  The ReadMe project exposes exactly two API definitions -- api-settings.json and
  json-api.json -- and both are reproduced here under those names.
