api_access:
  published_tier: null
  note: >-
    No tier on the published price list names API access. The API's own getting-started page
    states "This is a private API. Contact support@workramp.com to see if you are eligible,
    and request access," and requires an enterprise account provisioned for Learn:Up — so API
    eligibility is a sales decision, not a plan line item.
  source: https://developers.workramp.com/reference/getting-started
notes:
  - Prices are "starting from" figures; the page routes every product to "Get a quote".
  - Products are sold individually as well as bundled — "Get individual products whenever you need them".
  - Confirm also sells a separate Frontline line; Scale-Up is the line that contains WorkRamp.
