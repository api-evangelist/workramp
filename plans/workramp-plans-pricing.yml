name: WorkRamp Plans and Pricing
description: >-
  WorkRamp is now sold as Confirm's Scale-Up product line — Learn:Up (the LMS, formerly
  WorkRamp) and Academy (customer/partner training, formerly WorkRamp) — and pricing moved
  from a quote-only page on workramp.com to a published per-seat price list on
  confirm.com/scale-up/pricing. Learn:Up, Perform and Practice each carry a public
  "starting from" per-user-per-month price billed annually and benchmarked on a 200-person
  company. Academy, Create, Library and Custom remain quote-only. There is still no
  published API-access tier and no per-call API pricing; API access is bundled with the
  platform subscription.
